# Netlify configuration for TSOTRA Next.js project
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory to publish (Next.js output)
  publish = ".next"
  
  # Build command - install all deps including devDependencies
  command = "npm ci && npm run build"

# Next.js runtime plugin (required for Next.js 13+ with App Router)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables for build
[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  # Force npm to install devDependencies
  NPM_FLAGS = "--include=dev"
  NODE_ENV = "development"

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects for SPA-style navigation (handled by Next.js)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/___netlify-handler"
  status = 200
  force = false

# Production context
[context.production]
  command = "npm ci && npm run build"

[context.production.environment]
  NODE_ENV = "development"

# Preview/Branch deploys context
[context.deploy-preview]
  command = "npm ci && npm run build"

[context.branch-deploy]
  command = "npm ci && npm run build"

# Dev branch specific settings
[context.dev]
  command = "npm ci && npm run build"
